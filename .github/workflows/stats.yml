name: Usage stats
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: stats
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/stats.mjs
      - name: Save to the stats branch
        run: |
          mkdir out && mv stats.json summary.json daily.json plans.json out/
          cd out
          git init -q -b stats
          git config user.name "gymbunnies-stats"
          git config user.email "stats@gymbunnies.fit"
          git add .
          git commit -qm "Usage stats $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats
